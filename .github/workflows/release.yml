# Push a tag like v0.2.0 to build CrispyClipper.exe and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: CrispyClipper
          path: target/release/CrispyClipper.exe
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/CrispyClipper.exe \
            --title "Crispy Clipper $GITHUB_REF_NAME" --generate-notes
