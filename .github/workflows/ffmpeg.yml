# Builds a minimal FFmpeg containing only what Crispy Clipper uses (screen capture, GPU encoders,
# AAC, MP4/MPEG-TS, thumbnails) and publishes it as a release asset the app downloads on first run.
name: Minimal FFmpeg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to (must match DOWNLOAD_URL in src/ffmpeg.rs)
        default: ffmpeg-min-3
      ffmpeg_ref:
        description: FFmpeg git tag
        default: n8.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm pkg-config make git libz-mingw-w64-dev

      - name: GPU encoder headers (NVIDIA, AMD)
        run: |
          # SDK 12.1: works with NVIDIA drivers 531+ (2023) and supports AV1.
          git clone --depth 1 --branch n12.1.14.0 https://github.com/FFmpeg/nv-codec-headers
          sudo make -C nv-codec-headers install PREFIX=/opt/deps
          git clone --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/AMF
          sudo mkdir -p /opt/deps/include/AMF
          sudo cp -r AMF/amf/public/include/* /opt/deps/include/AMF/

      - name: Configure
        run: |
          git clone --depth 1 --branch "${{ inputs.ffmpeg_ref }}" https://github.com/FFmpeg/FFmpeg ffmpeg
          cd ffmpeg
          PKG_CONFIG_PATH=/opt/deps/lib/pkgconfig ./configure \
            --target-os=mingw32 --arch=x86_64 --cross-prefix=x86_64-w64-mingw32- \
            --pkg-config=pkg-config --pkg-config-flags=--static \
            --extra-cflags="-I/opt/deps/include -O2" --extra-ldflags="-static" \
            --enable-static --disable-shared --disable-debug --disable-doc --disable-network \
            --disable-ffplay --disable-ffprobe --disable-autodetect \
            --disable-everything \
            --enable-d3d11va --enable-dxva2 --enable-ffnvcodec --enable-nvenc --enable-amf --enable-mediafoundation \
            --enable-w32threads --enable-swscale --enable-swresample --enable-zlib \
            --enable-indev=lavfi \
            --enable-filter=ddagrab,scale_d3d11,color,fps,tile,asplit,pan,amix,volume,hwdownload,hwupload,hwmap,format,scale,null,aresample,aformat,anull,setpts,asetpts,copy \
            --enable-protocol=file,pipe \
            --enable-demuxer=mov,mpegts,pcm_f32le,image2,png_pipe,mjpeg \
            --enable-muxer=mp4,mov,mpegts,image2,null,pcm_f32le \
            --enable-encoder=h264_nvenc,hevc_nvenc,av1_nvenc,h264_amf,hevc_amf,av1_amf,h264_mf,hevc_mf,aac,png,mjpeg,wrapped_avframe,pcm_f32le \
            --enable-decoder=h264,hevc,av1,aac,pcm_f32le,png,mjpeg,wrapped_avframe \
            --enable-hwaccel=h264_d3d11va,hevc_d3d11va,av1_d3d11va,h264_dxva2,hevc_dxva2,av1_dxva2 \
            --enable-parser=h264,hevc,av1,aac,png,mjpeg \
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb,extract_extradata,dump_extradata,null
      - name: Build
        run: |
          cd ffmpeg
          make -j"$(nproc)"
          x86_64-w64-mingw32-strip ffmpeg.exe
          ls -la ffmpeg.exe
          cp ffmpeg.exe ..
          cp COPYING.LGPLv2.1 ../FFMPEG-LICENSE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-min
          path: |
            ffmpeg.exe
            FFMPEG-LICENSE.txt

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-min
      - name: Check required components are present
        shell: pwsh
        run: |
          $f = .\ffmpeg.exe -hide_banner -filters 2>&1 | Out-String
          $e = .\ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          foreach ($x in 'ddagrab','scale_d3d11','hwdownload','fps','tile','asplit','pan','amix') { if ($f -notmatch $x) { throw "missing filter $x" } }
          foreach ($x in 'h264_nvenc','hevc_amf','h264_mf','aac','mjpeg','png') { if ($e -notmatch $x) { throw "missing encoder $x" } }
          # End to end: screenshot-style PNG, then a thumbnail from it (no GPU on the runner).
          .\ffmpeg.exe -hide_banner -v error -f lavfi -i "color=c=red:s=320x240:d=1" -frames:v 1 -y test.png
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path test.png)) { throw "PNG encode failed" }
          .\ffmpeg.exe -hide_banner -v error -i test.png -vf scale=160:-2 -q:v 5 -y test.jpg
          if ($LASTEXITCODE -ne 0) { throw "thumbnail failed" }
          "size: {0:N1} MB" -f ((Get-Item .\ffmpeg.exe).Length / 1MB)

  publish:
    needs: smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-min
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FFmpeg (minimal build for Crispy Clipper)" \
              --notes "LGPL FFmpeg ${{ inputs.ffmpeg_ref }} built by .github/workflows/ffmpeg.yml with only the components Crispy Clipper uses. Source: https://github.com/FFmpeg/FFmpeg/tree/${{ inputs.ffmpeg_ref }}" --latest=false
          gh release upload "$TAG" ffmpeg.exe FFMPEG-LICENSE.txt --clobber -R "$GITHUB_REPOSITORY"
