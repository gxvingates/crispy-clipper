[package]
name = "crispy-clipper"
description = "Lightweight local game clipper"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gxvingates/crispy-clipper"

[[bin]]
name = "CrispyClipper"
path = "src/main.rs"

[dependencies]
nnnoiseless = { version = "0.5.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = "0.37.1"
toml = "0.8"
tray-icon = "0.24"
wasapi = "0.22"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_SystemInformation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Console", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp"] }
wry = "0.57.0"

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"
lto = true
strip = true

[build-dependencies]
winresource = "0.1.34"
